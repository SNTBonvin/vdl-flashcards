# Recopie automatique de la branche « main » vers la Forge des communs
# numériques éducatifs, qui héberge et publie le site.
#
# Pourquoi ce détour : dans son édition libre, GitLab ne sait pas *tirer*
# depuis un dépôt distant — le miroir en extraction est réservé aux éditions
# payantes. C'est donc GitHub qui pousse.
#
# À faire une seule fois avant que cela fonctionne :
#
#   1. Sur la Forge : Paramètres → Jetons d'accès → créer un jeton de projet,
#      rôle « Mainteneur », portée « write_repository ». Copier la valeur, elle
#      n'est affichée qu'une fois.
#   2. Sur GitHub : Settings → Secrets and variables → Actions → New repository
#      secret, nommé exactement FORGE_TOKEN, contenant ce jeton.
#
# Règle d'usage : les fichiers se déposent **ici**, sur GitHub. La Forge est un
# miroir ; un dépôt fait directement sur elle fait diverger les deux dépôts et
# bloque la recopie jusqu'à ce qu'on la force.

name: Miroir vers la Forge

on:
  push:
    branches: [main]
  # Permet aussi de relancer la recopie à la main depuis l'onglet Actions.
  workflow_dispatch:
    inputs:
      forcer:
        description: >-
          Écraser l'état de la Forge. À n'utiliser qu'après un dépôt fait
          directement sur elle : le commit correspondant sera perdu, son
          contenu devant être présent ici.
        type: boolean
        default: false

# Deux recopies simultanées se marcheraient dessus.
concurrency:
  group: miroir-forge
  cancel-in-progress: false

env:
  FORGE_REPO: forge.apps.education.fr/bonvinchristophe/vdl-flashcards.git

jobs:
  miroir:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer l'historique complet
        uses: actions/checkout@v5
        with:
          # Sans l'historique entier, la Forge refuserait la mise à jour.
          fetch-depth: 0
          ref: main

      - name: Pousser vers la Forge
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          FORCER: ${{ inputs.forcer }}
        run: |
          set -euo pipefail
          if [ -z "${FORGE_TOKEN}" ]; then
            echo "Le secret FORGE_TOKEN est absent. Voir l'en-tête de ce fichier." >&2
            exit 1
          fi
          # Volontairement sans « --force » : si les deux dépôts divergeaient,
          # mieux vaut un échec visible que l'écrasement silencieux d'une
          # modification faite directement sur la Forge.
          #
          # Le forçage reste possible à la main, pour le seul cas où un fichier
          # a été déposé sur la Forge par mégarde : on le remet d'abord ici,
          # puis on relance ce travail avec « forcer » coché.
          if [ "${FORCER}" = "true" ]; then
            echo "Recopie forcée : l'état de la Forge va être remplacé."
            git push --force "https://oauth2:${FORGE_TOKEN}@${FORGE_REPO}" HEAD:main
          else
            git push "https://oauth2:${FORGE_TOKEN}@${FORGE_REPO}" HEAD:main
          fi
          echo "Branche main recopiée sur la Forge — le pipeline de publication va suivre."
