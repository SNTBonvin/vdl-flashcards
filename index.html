<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f6f4ee" />
    <meta name="description" content="Créer, réviser et planifier ses flashcards avec répétition espacée." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flashcards" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <!-- Polices auto-hébergées (src/styles/fonts.css) : aucune requête tierce.
         Les deux graisses les plus utilisées sont préchargées. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/hanken-grotesk-latin-400-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/hanken-grotesk-latin-700-normal.woff2"
      crossorigin
    />
    <title>Flashcards — Val de Lys</title>
    <script>
      /*
       * Applique le thème avant le premier rendu, sinon l'application
       * apparaîtrait en clair pendant une fraction de seconde avant de basculer
       * en sombre. Doit rester en ligne et minimal : il s'exécute avant tout.
       */
      (function () {
        var mode = 'auto'
        try {
          var stored = localStorage.getItem('vdl-theme')
          if (stored === 'light' || stored === 'dark' || stored === 'auto') mode = stored
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode === 'auto' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#14120e' : '#f6f4ee')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
